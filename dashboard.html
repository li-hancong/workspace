<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <title>工作台 · Li Hancong</title>
  <style>
    :root {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #202124;
      background: #f8fafd;
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: linear-gradient(180deg, #f8fafd 0%, #f1f5f9 100%); }
    .topbar { height: 64px; padding: 0 28px; display: flex; align-items: center; justify-content: space-between; background: rgba(255,255,255,.94); border-bottom: 1px solid #e6e9ef; position: sticky; top: 0; backdrop-filter: blur(14px); }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 650; }
    .logo { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: #1a73e8; color: #fff; font-weight: 700; }
    .user { display: flex; align-items: center; gap: 12px; color: #5f6368; font-size: 14px; }
    button { border: 1px solid #dadce0; background: #fff; color: #3c4043; border-radius: 10px; padding: 9px 14px; cursor: pointer; font-weight: 600; }
    button:hover { background: #f8f9fa; }
    main { width: min(1120px, calc(100% - 36px)); margin: 42px auto 64px; }
    .hero { background: #fff; border: 1px solid #e3e7ed; border-radius: 20px; padding: 30px; box-shadow: 0 10px 28px rgba(60,64,67,.06); }
    .eyebrow { color: #1a73e8; font-size: 13px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 10px 0 8px; font-size: clamp(30px, 5vw, 44px); letter-spacing: -.035em; }
    .sub { margin: 0; color: #5f6368; line-height: 1.7; }
    .grid { margin-top: 22px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 16px; }
    .card { background: #fff; border: 1px solid #e3e7ed; border-radius: 16px; padding: 22px; min-height: 150px; }
    .card h2 { margin: 12px 0 6px; font-size: 18px; }
    .card p { margin: 0; color: #5f6368; font-size: 14px; line-height: 1.6; }
    .icon { width: 38px; height: 38px; border-radius: 11px; display: grid; place-items: center; background: #e8f0fe; color: #1967d2; font-weight: 800; }
    .status { margin-top: 18px; padding: 13px 15px; border-radius: 12px; background: #e6f4ea; color: #137333; font-size: 14px; border: 1px solid #ceead6; }
    @media (max-width: 760px) { .grid { grid-template-columns: 1fr; } .topbar { padding: 0 18px; } .user span { display: none; } }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand"><div class="logo">LH</div><span>Li Hancong Workspace</span></div>
    <div class="user"><span id="userEmail">正在验证登录状态…</span><button id="logoutButton">退出登录</button></div>
  </header>

  <main>
    <section class="hero">
      <div class="eyebrow">Private Workspace</div>
      <h1>欢迎回来</h1>
      <p class="sub">这是登录后的私人工作台。后续可以继续接入文件中心、测试报告、图片管理和数据看板。</p>
      <div class="status" id="authStatus">正在验证安全会话…</div>
    </section>

    <section class="grid" aria-label="功能模块">
      <article class="card"><div class="icon">01</div><h2>文件中心</h2><p>预留文件上传、分类、检索和个人文件空间。</p></article>
      <article class="card"><div class="icon">02</div><h2>测试报告</h2><p>预留可靠性测试报告、图片与结果管理入口。</p></article>
      <article class="card"><div class="icon">03</div><h2>数据看板</h2><p>预留统计趋势、状态总览和后续数据分析模块。</p></article>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import { APP_CONFIG, isAuthConfigured } from "./config.js";

    const status = document.querySelector("#authStatus");
    const email = document.querySelector("#userEmail");
    const logout = document.querySelector("#logoutButton");

    if (!isAuthConfigured()) {
      status.textContent = "登录服务尚未配置，当前页面已安全锁定。";
      status.style.background = "#fef7e0";
      status.style.color = "#b06000";
      email.textContent = "未配置认证服务";
      logout.disabled = true;
    } else {
      const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabasePublishableKey);
      const { data: { session }, error } = await supabase.auth.getSession();
      if (error || !session) {
        location.replace("./");
      } else {
        email.textContent = session.user?.email || "已登录用户";
        status.textContent = "身份验证通过，当前会话有效。";
        logout.addEventListener("click", async () => {
          logout.disabled = true;
          await supabase.auth.signOut();
          location.replace("./");
        });
      }
    }
  </script>
</body>
</html>
