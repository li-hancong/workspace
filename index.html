<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="color-scheme" content="light" />
  <meta name="description" content="Li Hancong Workspace 登录入口" />
  <title>登录 · Li Hancong Workspace</title>
  <style>
    :root {
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      color: #202124;
      background: #f8fafd;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 28px 18px;
      background:
        radial-gradient(circle at 15% 12%, rgba(26,115,232,.10), transparent 32%),
        radial-gradient(circle at 86% 85%, rgba(52,168,83,.07), transparent 28%),
        linear-gradient(180deg, #fbfdff 0%, #f3f6fa 100%);
    }
    .shell { width: min(1040px, 100%); display: grid; grid-template-columns: 1.05fr .95fr; background: #fff; border: 1px solid #e3e7ed; border-radius: 24px; overflow: hidden; box-shadow: 0 22px 65px rgba(60,64,67,.12); }
    .intro { padding: 56px; background: linear-gradient(145deg, #f8fbff, #edf4ff); border-right: 1px solid #e6ebf1; display: flex; flex-direction: column; justify-content: space-between; min-height: 620px; }
    .brand { display: flex; align-items: center; gap: 12px; font-weight: 700; letter-spacing: -.01em; }
    .logo { width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center; background: #1a73e8; color: #fff; box-shadow: 0 8px 20px rgba(26,115,232,.20); }
    .hero { max-width: 460px; }
    .kicker { color: #1967d2; font-size: 13px; font-weight: 750; letter-spacing: .10em; text-transform: uppercase; }
    h1 { margin: 16px 0 14px; font-size: clamp(38px, 5vw, 58px); line-height: 1.05; letter-spacing: -.045em; }
    .hero p { margin: 0; color: #5f6368; font-size: 16px; line-height: 1.8; }
    .meta { color: #7a8088; font-size: 13px; line-height: 1.6; }
    .login { padding: 56px; display: flex; align-items: center; }
    .form { width: 100%; }
    .form h2 { margin: 0; font-size: 28px; letter-spacing: -.025em; }
    .form .sub { margin: 8px 0 30px; color: #5f6368; font-size: 14px; line-height: 1.6; }
    label { display: block; margin: 0 0 8px; color: #3c4043; font-size: 13px; font-weight: 650; }
    .field { margin-bottom: 18px; }
    input { width: 100%; height: 48px; border: 1px solid #cfd5dd; border-radius: 12px; padding: 0 14px; font: inherit; color: #202124; background: #fff; outline: none; transition: border-color .15s, box-shadow .15s; }
    input:focus { border-color: #1a73e8; box-shadow: 0 0 0 3px rgba(26,115,232,.12); }
    .button { width: 100%; height: 48px; border: 0; border-radius: 12px; background: #1a73e8; color: #fff; font: inherit; font-weight: 700; cursor: pointer; box-shadow: 0 8px 18px rgba(26,115,232,.18); transition: transform .12s, background .15s; }
    .button:hover:not(:disabled) { background: #1765cc; }
    .button:active:not(:disabled) { transform: translateY(1px); }
    .button:disabled { cursor: not-allowed; opacity: .55; box-shadow: none; }
    .message { min-height: 46px; margin-top: 18px; padding: 12px 14px; border-radius: 11px; font-size: 13px; line-height: 1.55; display: none; }
    .message.show { display: block; }
    .message.info { color: #174ea6; background: #e8f0fe; border: 1px solid #d2e3fc; }
    .message.error { color: #b3261e; background: #fce8e6; border: 1px solid #f6cbc7; }
    .message.success { color: #137333; background: #e6f4ea; border: 1px solid #ceead6; }
    .security { margin-top: 22px; display: flex; gap: 9px; align-items: flex-start; color: #777d85; font-size: 12px; line-height: 1.55; }
    .dot { margin-top: 5px; width: 8px; height: 8px; border-radius: 999px; background: #34a853; flex: 0 0 auto; }
    @media (max-width: 820px) {
      .shell { grid-template-columns: 1fr; max-width: 560px; }
      .intro { min-height: auto; padding: 34px; border-right: 0; border-bottom: 1px solid #e6ebf1; gap: 46px; }
      .hero h1 { font-size: 40px; }
      .login { padding: 34px; }
    }
    @media (max-width: 480px) { body { padding: 0; background: #fff; } .shell { border: 0; border-radius: 0; box-shadow: none; min-height: 100vh; } .intro, .login { padding: 28px 22px; } }
  </style>
</head>
<body>
  <main class="shell">
    <section class="intro">
      <div class="brand"><div class="logo">LH</div><span>Li Hancong Workspace</span></div>
      <div class="hero">
        <div class="kicker">Secure Workspace</div>
        <h1>一个入口，连接你的私人工作空间。</h1>
        <p>为文件、测试报告、图片与数据看板预留统一入口。正式域名将使用 <strong>www.lihancong.com</strong>。</p>
      </div>
      <div class="meta">GitHub Pages 静态前端 · Supabase Auth 身份认证 · HTTPS 正式域名</div>
    </section>

    <section class="login">
      <form class="form" id="loginForm" novalidate>
        <h2>欢迎回来</h2>
        <p class="sub">使用已授权的邮箱和密码登录。</p>

        <div class="field">
          <label for="email">邮箱</label>
          <input id="email" name="email" type="email" autocomplete="email" placeholder="name@example.com" required />
        </div>

        <div class="field">
          <label for="password">密码</label>
          <input id="password" name="password" type="password" autocomplete="current-password" placeholder="输入密码" required />
        </div>

        <button class="button" id="loginButton" type="submit">登录</button>
        <div class="message" id="message" role="status" aria-live="polite"></div>

        <div class="security"><span class="dot"></span><span>密码不会写入 GitHub 仓库。认证由 Supabase Auth 完成，敏感密钥不得放在前端。</span></div>
      </form>
    </section>
  </main>

  <script type="module">
    import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";
    import { APP_CONFIG, isAuthConfigured } from "./config.js";

    const form = document.querySelector("#loginForm");
    const button = document.querySelector("#loginButton");
    const message = document.querySelector("#message");
    const email = document.querySelector("#email");
    const password = document.querySelector("#password");

    function show(text, type = "info") {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    if (!isAuthConfigured()) {
      button.disabled = true;
      email.disabled = true;
      password.disabled = true;
      show("前端已完成部署，真实登录服务等待 Supabase 项目配置。配置完成后无需改页面即可启用。", "info");
    } else {
      const supabase = createClient(APP_CONFIG.supabaseUrl, APP_CONFIG.supabasePublishableKey);
      const { data: { session } } = await supabase.auth.getSession();
      if (session) location.replace("./dashboard.html");

      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const userEmail = email.value.trim();
        const userPassword = password.value;
        if (!userEmail || !userPassword) {
          show("请输入邮箱和密码。", "error");
          return;
        }
        button.disabled = true;
        button.textContent = "正在验证…";
        show("正在安全验证登录信息…", "info");

        const { error } = await supabase.auth.signInWithPassword({ email: userEmail, password: userPassword });
        if (error) {
          button.disabled = false;
          button.textContent = "登录";
          show("登录失败，请检查邮箱、密码或账号状态。", "error");
          return;
        }
        show("验证成功，正在进入工作台…", "success");
        location.replace("./dashboard.html");
      });
    }
  </script>
</body>
</html>
