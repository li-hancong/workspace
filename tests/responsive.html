<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>成考练习室 · 响应式检查</title><style>*{box-sizing:border-box}body{margin:0;font:14px/1.6 system-ui;background:#eef1ee;color:#183b39}header{position:sticky;top:0;z-index:2;padding:14px 24px;background:white;border-bottom:1px solid #ccd9d0;display:flex;align-items:center;gap:16px;flex-wrap:wrap}select,button{font:inherit;padding:9px 12px;border:1px solid #b3c6b9;border-radius:8px;background:white}#stage{padding:20px;overflow:auto}iframe{display:block;background:white;height:800px;border:1px solid #abbeb2;margin:auto;box-shadow:0 5px 20px #1232}#report{max-width:1250px;margin:0 auto 24px;padding:14px 20px;background:#fff;border-radius:10px;white-space:pre-wrap}label{font-weight:600}small{color:#617571}</style><header><strong>响应式布局检查</strong><label>画面宽度 <select id="width"><option value="320">320px · 窄手机</option><option value="375">375px · 手机</option><option value="390" selected>390px · 手机</option><option value="430">430px · 大手机</option><option value="768">768px · 平板</option><option value="820">820px · 平板</option><option value="1024">1024px · 小电脑</option><option value="1280">1280px · 电脑</option></select></label><label>画面高度 <select id="height"><option value="480">480px · 横屏</option><option value="640">640px · 小屏</option><option value="800" selected>800px · 标准</option><option value="1024">1024px · 长屏</option></select></label><button id="check">检查尺寸</button><small>实际页面在指定宽度内渲染；不是手机系统或浏览器仿真。测试记录仅存当前浏览器。</small></header><div id="stage"><iframe id="screen" title="考试系统测试画面" src="../exam/?v=20261012.7" style="width:390px"></iframe></div><pre id="report">页面加载后点击“检查尺寸”。</pre><script>
const height=document.querySelector('#height');height.onchange=()=>{document.querySelector('#screen').style.height=height.value+'px'};const frame=document.querySelector('#screen'),width=document.querySelector('#width'),report=document.querySelector('#report');frame.style.boxSizing='content-box';width.onchange=()=>{frame.style.width=width.value+'px';report.textContent='已切换到'+width.value+'px，请查看画面并检查尺寸。'};document.querySelector('#check').onclick=()=>{try{const doc=frame.contentDocument,w=frame.contentWindow,visible=e=>e.getBoundingClientRect().height>0&&w.getComputedStyle(e).visibility!=='hidden'&&!e.closest('details:not([open])')||e.tagName==='SUMMARY'&&e.getBoundingClientRect().height>0,elements=[...doc.querySelectorAll('button,input,select,textarea,.option,summary')].filter(visible),small=elements.filter(e=>{const r=e.getBoundingClientRect();return e.tagName!=='INPUT'&&(r.width<43.5||r.height<43.5)}).map(e=>({label:(e.textContent||e.id).trim().slice(0,40),width:Math.round(e.getBoundingClientRect().width),height:Math.round(e.getBoundingClientRect().height)})),overflow=[...doc.querySelectorAll('body *')].filter(e=>{const r=e.getBoundingClientRect();return visible(e)&&r.right>doc.documentElement.clientWidth+1&&e.tagName!=='OPTION'}).map(e=>({element:e.tagName,label:(e.textContent||e.id).trim().slice(0,45),right:Math.round(e.getBoundingClientRect().right)}));const nav=doc.querySelector('.nav-actions'),inView=e=>{if(!e)return false;const r=e.getBoundingClientRect();return r.width>0&&r.height>0&&r.top>=-1&&r.bottom<=w.innerHeight+1;},navRect=nav?.getBoundingClientRect(),lastOption=doc.querySelector('.option:last-child'),heading=doc.querySelector('.exam-head');report.textContent=JSON.stringify({viewport:w.innerWidth,height:w.innerHeight,body:doc.documentElement.scrollWidth,horizontalOverflow:doc.documentElement.scrollWidth>doc.documentElement.clientWidth+1,smallTargets:small,lesson:doc.querySelector('#math-lesson')?{visible:!doc.querySelector('#math-lesson').hidden,title:doc.querySelector('.lesson-intro h3').textContent,terms:doc.querySelectorAll('.lesson-terms dt').length,answerVisible:!doc.querySelector('#question-answer').hidden}:null,answerGroups:[...doc.querySelectorAll(".answer-group")].map(g=>({type:g.querySelector("h3").textContent,status:g.querySelector(".group-status").textContent,questions:g.querySelectorAll("[data-index]").length})),overflowElements:overflow.slice(0,12),navigation:nav?{position:w.getComputedStyle(nav).position,top:Math.round(navRect.top),bottom:Math.round(navRect.bottom),buttonHeight:Math.round(doc.querySelector("#next").getBoundingClientRect().height),buttonBottomGap:Math.round(w.innerHeight-doc.querySelector("#next").getBoundingClientRect().bottom),nextVisible:inView(doc.querySelector('#next')),previousVisible:inView(doc.querySelector('#prev')),cardVisible:inView(doc.querySelector('#nav-card')),submitVisible:inView(doc.querySelector('#submit')),lastOptionAboveNavigation:lastOption&&visible(lastOption)?lastOption.getBoundingClientRect().bottom<=navRect.top:null,questionTop:Math.round(doc.querySelector('.question').getBoundingClientRect().top),headerBottom:Math.round(heading.getBoundingClientRect().bottom)}:null},null,2);}catch(e){report.textContent=e.message;}};
</script></html>
